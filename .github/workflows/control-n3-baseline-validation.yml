name: Control N3 Baseline Validation

on:
  push:
    branches:
      - research/control-active

permissions:
  contents: read

jobs:
  validate-n3-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build complete study clone
        run: npm run build

      - name: Static N1 frozen audit
        run: node scripts/audit-mission01-control-n1.mjs

      - name: Static N2 frozen audit
        run: node scripts/audit-mission01-control-n2.mjs

      - name: Static N3 baseline audit
        run: node scripts/audit-mission01-control-n3-baseline.mjs

      - name: Verify N1 and N2 generated outputs equal frozen checkpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/n3-baseline

          git worktree add --detach /tmp/apulab-control-n1-frozen b717a70b685f382044276b7a30bec5b556e94e9c
          (
            cd /tmp/apulab-control-n1-frozen
            npm ci --no-fund --no-audit
            npm run build
          )
          n1_frozen="$(sha256sum /tmp/apulab-control-n1-frozen/public/missions/mission01/level1.html | awk '{print $1}')"
          n1_current="$(sha256sum public/missions/mission01/level1.html | awk '{print $1}')"
          printf 'level1 frozen=%s current=%s\n' "$n1_frozen" "$n1_current" | tee test-results/n3-baseline/n1-frozen-hash.txt
          test "$n1_frozen" = "$n1_current"

          git worktree add --detach /tmp/apulab-control-n2-frozen dbb60df8f509aa0fe461db015445b28d0e78b5cc
          (
            cd /tmp/apulab-control-n2-frozen
            npm ci --no-fund --no-audit
            npm run build
          )
          n2_frozen="$(sha256sum /tmp/apulab-control-n2-frozen/public/missions/mission01/level2.html | awk '{print $1}')"
          n2_current="$(sha256sum public/missions/mission01/level2.html | awk '{print $1}')"
          printf 'level2 frozen=%s current=%s\n' "$n2_frozen" "$n2_current" | tee test-results/n3-baseline/n2-frozen-hash.txt
          test "$n2_frozen" = "$n2_current"

      - name: Verify N3-N7 generated outputs unchanged from baseline main
        shell: bash
        run: |
          set -euo pipefail
          : > test-results/n3-baseline/n3-n7-main-parity.txt
          git worktree add --detach /tmp/apulab-control-main origin/main
          (
            cd /tmp/apulab-control-main
            npm ci --no-fund --no-audit
            npm run build
          )
          for level in 3 4 5 6 7; do
            baseline="$(sha256sum /tmp/apulab-control-main/public/missions/mission01/level${level}.html | awk '{print $1}')"
            current="$(sha256sum public/missions/mission01/level${level}.html | awk '{print $1}')"
            printf 'level%s baseline=%s current=%s\n' "$level" "$baseline" "$current" | tee -a test-results/n3-baseline/n3-n7-main-parity.txt
            test "$baseline" = "$current"
          done

      - name: Install Playwright Chromium
        run: |
          npm install --global playwright@1.55.0 --no-fund --no-audit
          playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Start production-mode preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/apulab-control-preview.log 2>&1 &
          echo $! > /tmp/apulab-control-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/apulab-control-preview.log
          exit 1

      - name: N1 frozen participant-view regression
        env:
          APULAB_BASE_URL: http://127.0.0.1:4173
        run: node tests/e2e/mission01-control-n1-freeze.cjs

      - name: N2 physical frozen regression
        env:
          APULAB_BASE_URL: http://127.0.0.1:4173
        run: node tests/e2e/mission01-control-n2.cjs

      - name: N2 telemetry privacy frozen regression
        env:
          APULAB_BASE_URL: http://127.0.0.1:4173
        run: node tests/e2e/mission01-control-n2-telemetry.cjs

      - name: N3 baseline geometry and canonical-program E2E
        env:
          APULAB_BASE_URL: http://127.0.0.1:4173
        run: node tests/e2e/mission01-control-n3-baseline.cjs

      - name: Current N3-N6 gameplay regression
        env:
          APULAB_BASE_URL: http://127.0.0.1:4173
        run: node tests/e2e/mission01-gameplay-n3-n6.cjs

      - name: App shell regression
        env:
          APULAB_BASE_URL: http://127.0.0.1:4173
        run: node tests/e2e/app-shell.cjs

      - name: N1-N7 smoke regression
        env:
          APULAB_BASE_URL: http://127.0.0.1:4173
        run: node tests/e2e/mission01-smoke.cjs

      - name: SFX regression
        env:
          APULAB_BASE_URL: http://127.0.0.1:4173
        run: node tests/e2e/mission01-sfx.cjs

      - name: N5 loops regression
        env:
          APULAB_BASE_URL: http://127.0.0.1:4173
        run: node tests/e2e/mission01-level5-final-loops.cjs

      - name: N6 parity regression
        env:
          APULAB_BASE_URL: http://127.0.0.1:4173
        run: |
          node tests/e2e/mission01-level6-n5-parity.cjs
          node tests/e2e/mission01-level6-navigation-identity.cjs
          node tests/e2e/mission01-level6-contract.cjs
          node tests/e2e/mission01-level6-final-position.cjs

      - name: N7 parity regression
        env:
          APULAB_BASE_URL: http://127.0.0.1:4173
        run: |
          node tests/e2e/mission01-level7-n6-parity.cjs
          node tests/e2e/mission01-level7-contract.cjs

      - name: Upload N3 baseline research evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: control-n3-baseline-evidence
          path: |
            test-results/n3-baseline
            test-results/n1-control
            test-results/n2-control
            test-results/app-shell
            test-results/smoke
          if-no-files-found: ignore
          retention-days: 5

      - name: Print preview log on failure
        if: failure()
        run: cat /tmp/apulab-control-preview.log || true
