name: Control N3 Baseline Validation

on:
  push:
    branches:
      - research/control-active

permissions:
  contents: read

jobs:
  inspect-n3-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build current study clone
        run: npm run build

      - name: Inspect generated N3 geometry and constraints without runtime changes
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const html = readFileSync('public/missions/mission01/level3.html','utf8');
          const needles = [
            'const start=', 'const goal=', 'const commands=', 'function renderProgram',
            'program.length', 'program.push', 'program.splice', 'program=',
            'executeCommand', 'runProgram', 'completeLevel', 'goal.c',
            'for(let r=0;r<8', 'for(let c=0;c<8', 'tiles[nr][nc]',
            'obstacle', 'blocked', 'MAX', 'limit', 'slot'
          ];
          const printed = new Set();
          for (const needle of needles) {
            let from = 0;
            let count = 0;
            while (count < 8) {
              const index = html.indexOf(needle, from);
              if (index < 0) break;
              const start = Math.max(0, index - 520);
              const end = Math.min(html.length, index + needle.length + 900);
              const snippet = html.slice(start,end).replace(/\s+/g,' ');
              const key = snippet.slice(0,220);
              if (!printed.has(key)) {
                printed.add(key);
                console.log(`\n=== ${needle} @ ${index} ===\n${snippet}\n`);
                count += 1;
              }
              from = index + needle.length;
            }
          }
          console.log(`N3_BYTES=${Buffer.byteLength(html,'utf8')}`);
          NODE
