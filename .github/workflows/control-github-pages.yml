name: GC GitHub Pages Hosting Validation

on:
  push:
    branches:
      - research/control-active
    paths:
      - .github/workflows/control-github-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gc-pages-validation
  cancel-in-progress: false

env:
  SOURCE_SHA: c30dfa3d81c67f9ece8ed8d2bc4d87a471e5e8e8
  PAGES_BASE: /ApuLabControl_GC/

jobs:
  build:
    name: Build exact GC Study Build for Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source SHA
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=${SOURCE_SHA}"
          echo "actual=${actual}"
          if [ "${actual}" != "${SOURCE_SHA}" ]; then
            echo "PAGES_SOURCE_SHA_MISMATCH"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages validation artifact
        env:
          VITE_DATA_MODE: mock
          VITE_SUPABASE_INGEST_URL: ''
        shell: bash
        run: |
          npm run prepare:missions
          npx tsc -b
          npx vite build --base="${PAGES_BASE}"

      - name: Rewrite root-relative runtime URLs for project Pages
        shell: bash
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = path.resolve('dist');
          const prefix = '/ApuLabControl_GC';
          const textExtensions = new Set(['.html', '.js', '.css', '.json', '.webmanifest']);
          const offenders = [];

          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full);
                continue;
              }
              if (!textExtensions.has(path.extname(entry.name))) continue;

              let text = fs.readFileSync(full, 'utf8');
              text = text
                .replace(/(?<![A-Za-z0-9._~-])\/(assets|missions|control)\//g, `${prefix}/$1/`)
                .replace(/(?<![A-Za-z0-9._~-])\/favicon\.svg/g, `${prefix}/favicon.svg`);
              fs.writeFileSync(full, text, 'utf8');

              const residual = text.match(/(?<![A-Za-z0-9._~-])\/(?:assets|missions|control)\//g);
              const favicon = text.match(/(?<![A-Za-z0-9._~-])\/favicon\.svg/g);
              if (residual || favicon) offenders.push(path.relative(root, full));
            }
          };

          walk(root);

          if (offenders.length) {
            console.error('PAGES_ROOT_PATH_REWRITE_INCOMPLETE');
            console.error(offenders.join('\n'));
            process.exit(1);
          }

          fs.writeFileSync(path.join(root, '.nojekyll'), '');
          console.log('PAGES_ROOT_PATH_REWRITE=PASS');
          NODE

      - name: Assert participant assets exist
        shell: bash
        run: |
          test -f dist/index.html
          for n in 1 2 3 4 5 6 7; do
            test -f "dist/missions/mission01/level${n}.html"
          done
          test -f dist/control/control-compact.css
          test -f dist/control/control-compact.js

      - name: Configure Pages metadata
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy GC Pages validation
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
