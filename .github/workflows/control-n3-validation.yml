name: Control N3/N4 Regression Gate
on:
  push:
    branches: [research/control-active]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '22.16.0', cache: npm }
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Build
        run: npm run build
      - name: Static N1/N2/N3/N4 contracts
        run: |
          node scripts/audit-mission01-control-n1.mjs
          node scripts/audit-mission01-control-n2.mjs
          node scripts/audit-mission01-control-n3.mjs
          node scripts/audit-mission01-control-n3-baseline.mjs
          node scripts/audit-mission01-control-n4.mjs
      - name: Frozen N1/N2 generated parity
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/n1 b717a70b685f382044276b7a30bec5b556e94e9c
          (cd /tmp/n1 && npm ci --no-fund --no-audit && npm run build)
          test "$(sha256sum /tmp/n1/public/missions/mission01/level1.html|awk '{print $1}')" = "$(sha256sum public/missions/mission01/level1.html|awk '{print $1}')"
          git worktree add --detach /tmp/n2 dbb60df8f509aa0fe461db015445b28d0e78b5cc
          (cd /tmp/n2 && npm ci --no-fund --no-audit && npm run build)
          test "$(sha256sum /tmp/n2/public/missions/mission01/level2.html|awk '{print $1}')" = "$(sha256sum public/missions/mission01/level2.html|awk '{print $1}')"
      - name: Frozen N3 exact regression
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/n3 a150e2039a5f35c6dabb6bb8cb6eed8ca6d9532e
          (cd /tmp/n3 && npm ci --no-fund --no-audit && npm run build)
          cmp /tmp/n3/public/missions/mission01/level3.html public/missions/mission01/level3.html
          for f in \
            public/control/n3-control.js \
            public/control/n3-control.css \
            public/control/n3-navigation-bridge.js \
            scripts/patch-mission01-control-n3.mjs \
            scripts/audit-mission01-control-n3.mjs \
            src/systems/Level3ControlTelemetryBridge.ts; do
            cmp "/tmp/n3/$f" "$f"
          done
      - name: Frozen N6-N7 generated parity
        run: |
          set -euo pipefail
          declare -A e=([6]=53cfd03663c5604a3878132f2e9313caa638bb413935fa4b730415c647ff9bca [7]=03e125bf9bb41f960039343a652dad358060a271c1c1050b61347f59d4e02eca)
          for n in 6 7; do test "${e[$n]}" = "$(sha256sum public/missions/mission01/level${n}.html|awk '{print $1}')"; done
      - name: Playwright Chromium
        run: |
          npm install --global playwright@1.55.0 --no-fund --no-audit
          playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done; cat /tmp/preview.log; exit 1
      - name: N1 frozen regression
        env: { APULAB_BASE_URL: 'http://127.0.0.1:4173' }
        run: node tests/e2e/mission01-control-n1-freeze.cjs
      - name: N3 entry through frozen N1/N2
        env: { APULAB_BASE_URL: 'http://127.0.0.1:4173' }
        run: node tests/e2e/mission01-control-n3-entry.cjs
      - name: N3 persistence correction and evidence
        env: { APULAB_BASE_URL: 'http://127.0.0.1:4173' }
        run: node tests/e2e/mission01-control-n3-persistence.cjs
      - name: N3 alternate valid program
        env: { APULAB_BASE_URL: 'http://127.0.0.1:4173' }
        run: node tests/e2e/mission01-control-n3-alternate.cjs
      - name: N3 to N4 transition
        env: { APULAB_BASE_URL: 'http://127.0.0.1:4173' }
        run: node tests/e2e/mission01-control-n3-transition.cjs
      - name: N3 telemetry privacy idempotency audio
        env: { APULAB_BASE_URL: 'http://127.0.0.1:4173' }
        run: node tests/e2e/mission01-control-n3-telemetry.cjs
      - name: N4 physical collision correction persistence evidence
        env: { APULAB_BASE_URL: 'http://127.0.0.1:4173' }
        run: node tests/e2e/mission01-control-n4.cjs
      - name: N4 alternate valid program
        env: { APULAB_BASE_URL: 'http://127.0.0.1:4173' }
        run: node tests/e2e/mission01-control-n4-alternate.cjs
      - name: N4 telemetry privacy idempotency audio
        env: { APULAB_BASE_URL: 'http://127.0.0.1:4173' }
        run: node tests/e2e/mission01-control-n4-telemetry.cjs
      - name: N4 to N5 transition
        env: { APULAB_BASE_URL: 'http://127.0.0.1:4173' }
        run: node tests/e2e/mission01-control-n4-transition.cjs
      - name: App shell
        env: { APULAB_BASE_URL: 'http://127.0.0.1:4173' }
        run: node tests/e2e/app-shell.cjs
      - name: SFX
        env: { APULAB_BASE_URL: 'http://127.0.0.1:4173' }
        run: node tests/e2e/mission01-sfx.cjs
      - name: N6/N7 downstream regressions
        env: { APULAB_BASE_URL: 'http://127.0.0.1:4173' }
        run: |
          node tests/e2e/mission01-level6-n5-parity.cjs
          node tests/e2e/mission01-level6-navigation-identity.cjs
          node tests/e2e/mission01-level6-contract.cjs
          node tests/e2e/mission01-level6-final-position.cjs
          node tests/e2e/mission01-level7-n6-parity.cjs
          node tests/e2e/mission01-level7-contract.cjs
      - name: Upload N3 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: control-n3-validation-evidence
          path: test-results/n3-control
          if-no-files-found: error
          retention-days: 7
      - name: Upload N4 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: control-n4-validation-evidence
          path: test-results/n4-control
          if-no-files-found: error
          retention-days: 7
      - name: Preview log on failure
        if: failure()
        run: cat /tmp/preview.log || true
